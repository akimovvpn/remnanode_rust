name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: python3 scripts/check_compatibility.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo build --locked --workspace
      - name: Download and verify pinned Xray
        run: python3 scripts/fetch_xray.py --output /tmp/xray
      - name: Download and verify pinned Mihomo
        run: python3 scripts/fetch_mihomo.py --output /tmp/mihomo
      - name: Real Xray tests
        env:
          XRAY_BINARY: /tmp/xray/xray
          MIHOMO_BINARY: /tmp/mihomo/mihomo
        run: cargo test --locked --workspace -- --include-ignored
      - run: python3 scripts/smoke.py --binary target/debug/remnanode-rust --xray /tmp/xray/xray
      - name: Smoke test with the Rust core
        run: python3 scripts/smoke.py --binary target/debug/remnanode-rust --xray target/debug/rcore
      - name: Real nftables tests
        run: docker run --rm --cap-add NET_ADMIN -v "$PWD":/src:ro -e CARGO_TARGET_DIR=/tmp/t -e NFT_TESTS=1 -w /src rust:1-slim-trixie sh -c 'apt-get update -qq && apt-get install -y -qq nftables && cargo test --locked --lib real_nftables'
      - run: docker build -t remnanode-rust:ci .
