services:
  remnanode:
    build: .
    image: remnanode-rust:local
    container_name: remnanode
    hostname: remnanode
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./state:/var/lib/remnanode
      - /var/log/remnanode:/var/log/xray
    # Add NET_ADMIN only when enabling firewall or connection-drop features.
    # cap_add: [NET_ADMIN]
