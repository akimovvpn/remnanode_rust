[package]
name = "rcore"
version = "0.1.0"
edition = "2024"
# Port of XTLS/Xray-core (MPL-2.0); file-level copyleft carries over to the ported code.
license = "MPL-2.0"
description = "Rust port of the Xray-core subset used by Remnawave Node"
repository = "https://github.com/akimovvpn/remnanode_rust"

[dependencies]
anyhow = "1"
base64 = "0.22"
brotli = "8"
httpdate = "1"
hkdf = "0.12"
hmac = "0.12"
ml-kem = "=0.3.3"
ring = "0.17"
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "1"
rustls-pemfile = "2"
sha2 = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets"] }
percent-encoding = "2"
ipnet = "2"
prost = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
remnanode-rust = { path = ".." }
